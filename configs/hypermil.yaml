method: "HyperMIL"
slug: "hypermil"
interface: "hypermil.interfaces:PipelineInterface"
paths_file: "configs/paths.local.yaml"
data:
  feature_manifest: "manifests/feature_manifest.csv"
  patient_folds: "splits/patient_folds.csv"
  max_patches: null
  patch_selection: null
  feature_dim: 512
  feature_dtype: "float32"
model:
  factory: "hypermil.models.hypermil:make_hypermil"
  args: {}
  device_argument: true
  wrap_core: false
checkpoint:
  directory: "checkpoints"
  pattern: "hypermil_{cohort_lower}_fold{fold}.pt"
evaluation:
  split: "outer_val"
  metric: "patient_harrell_c"
  risk_direction: "higher_risk_shorter_survival"
  std_ddof: 1
training:
  epochs: 100
  seed: 42
  optimizer: "Adam"
  lr: 0.0001
  weight_decay: 0.0001
  selection_split: "inner_val"
  objective: "cox_efron"
parameters:
  pipeline_configuration: "embedded_in_checkpoint"
  canonical_factory: "hypermil.models.hypermil:make_hypermil"
  attention_factory: "hypermil.adapters:PatientAttention"
