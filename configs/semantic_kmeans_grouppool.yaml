method: "Semantic-KMeans-GroupPool"
slug: "semantic_kmeans_grouppool"
interface: "hypermil.interfaces:KMeansInterface"
paths_file: "configs/paths.local.yaml"
data:
  feature_manifest: "manifests/feature_manifest.csv"
  patient_folds: "splits/patient_folds.csv"
  max_patches: null
  patch_selection: null
  feature_dim: 512
  feature_dtype: "float32"
model:
  factory: "hypermil.models.pooling:Head"
  args: {}
  device_argument: false
  wrap_core: false
checkpoint:
  directory: "checkpoints"
  pattern: "semantic_kmeans_grouppool_{cohort_lower}_fold{fold}.pt"
evaluation:
  split: "outer_val"
  metric: "patient_harrell_c"
  risk_direction: "higher_risk_shorter_survival"
  std_ddof: 1
training:
  epochs: 100
  seed: 42
  optimizer: "Adam"
  lr: 0.0001
  weight_decay: 0.0001
  selection_split: "inner_val"
  objective: "cox_efron"
parameters:
  cache_subdir: "Semantic-KMeans-GroupPool"
  n_clusters: 10
  seed: 42
  n_init: 10
  space: "semantic"
